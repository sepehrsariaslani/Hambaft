<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="application-name" content="هم‌بافت" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F0E3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="هم‌بافت" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="هم‌بافت، داشبورد شخصی مدیریت زندگی، عادت‌ها، اهداف، مالی، ژورنال و برنامه‌ریزی روزانه." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/hambaft-icon.svg" type="image/svg+xml" />
    <title>هم‌بافت</title>
    {% if inline_css %}
    <style data-hambaft-inline="app">{{ inline_css | safe }}</style>
    {% elif css_path %}
    <link rel="stylesheet" crossorigin href="{{ css_path }}">
    {% endif %}
    {% if inline_js %}
    <script type="module" data-hambaft-inline="app">{{ inline_js | safe }}</script>
    {% elif js_path %}
    <script type="module" crossorigin src="{{ js_path }}"></script>
    {% endif %}
  </head>
  <body class="h-full antialiased">
    <div id="root" class="h-full"></div>
  </body>
</html>
